# Compute Current rebuild — pipeline configuration (contracts.md §4, ADR-002/004/006/007)
# Validated strictly by packages/shared/src/schema/config.ts; unknown keys fail the run.
# Environment overrides: CC_FLAG_STAGES_<STAGE>=true|false, CC_FLAG_PUBLISH_TARGET=none|staging|production.

schedule:
  cron: "45 15,23,7 * * *"   # 00:45 / 08:45 / 16:45 KST (ADR-002)
  timezone: UTC
  slot_hours: 8

flags:
  stages:
    ingest: true
    normalize: false             # Phase 3b logic is in; default OFF until Phase 4 (contracts §7). Override: CC_FLAG_STAGES_NORMALIZE=true
    score: false                 # Phase 3c logic is in; default OFF until Phase 4 (contracts §7). Override: CC_FLAG_STAGES_SCORE=true
    generate: true
    qa: true
    image: true
    publish: true
  publish_target: none         # none | staging | production (ADR-006; production only at Phase 5 cutover)

caps:
  briefs_per_cycle: { min: 1, max: 2 }
  essays_per_day: 1
  pool_max_items: 200          # legacy cap was 30 (Phase 0 H1); re-measured in Phase 4. Applied after cross-source dedupe, lowest tiers cut first
  pool_max_age_days: 10
  items_per_source: 6          # newest N per registry id (legacy keyed the cap by display name)

ingest:                        # Phase 3a live ingest; every key is optional (defaults in packages/shared/src/schema/config.ts)
  concurrency: 6               # feeds fetched at once (legacy: unbounded Promise.all)
  extract_concurrency: 3       # article pages extracted at once
  feed_timeout_ms: 20000
  page_timeout_ms: 12000
  max_body_bytes: 6291456      # 6 MiB streaming cap per response (Substack full-content feeds exceed 2 MiB)
  retry_attempts: 1            # per source, timeouts/5xx/429 only (the whole-run retry is gone)
  retry_backoff_ms: 2000
  snippet_chars: 220
  body_preview_chars: 800
  min_title_chars: 12
  max_title_chars: 220
  auto_disable_after: 5        # consecutive failed runs -> sources.enabled=false in the table (YAML untouched)
  extract_bodies: true         # fetch article bodies for text_rights: full sources
  extract_host_delay_ms: 1000  # minimum interval between page requests to one host; extract.delay_ms raises it per source (arXiv 15000)
  user_agent: "Mozilla/5.0 (compatible; ComputeCurrentBot/1.0; +https://www.computecurrent.com)"

normalize:                     # Phase 3b dedupe; every key is optional (defaults in packages/shared/src/schema/config.ts)
  version: "2026-10-20.1"      # candidates.rubric_version = normalize/<version> on dedupe rejections; bump when a rule changes
  title_similarity: 0.85       # title token Dice (ADR-004)
  body_similarity: 0.6         # word 5-gram shingle Jaccard over the feed body/preview
  body_min_tokens: 40
  published_window_days: 7     # title comparison window against publications (URL identity match is unbounded)
  published_page_size: 1000    # every published row is read for the URL index, in pages of this size (PostgREST max-rows is 1000)

budget:
  run_usd: 2.0                 # STOP-THE-LINE threshold (brief §5.4)
  soft_warn_usd: 1.5
  max_calls: 60

llm:
  provider: fixture            # anthropic | openrouter | fixture | disabled — live providers land in Phase 3d
  models:
    curate: claude-haiku-5-5
    news_brief: claude-opus-5-5
    expert_lens: claude-opus-5-5
    insight_essay: claude-opus-5-5
    qa_assist: claude-haiku-5-5

image:
  provider: placeholder        # placeholder | openai | fixture
  fallback_chain: [placeholder]

notify:
  telegram:
    enabled: false             # Phase 3i
