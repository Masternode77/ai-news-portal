# Compute Current rebuild — scoring & selection rubric (Phase 3c, contracts.md §4, ADR-004).
# Validated strictly by packages/shared/src/schema/scoring.ts (ScoringConfig); unknown keys fail the run.
# The engine (packages/pipeline/src/stages/score.ts) has a fixed shape: five axes, a weighted
# total, two thresholds, named relevance lifts and caps. Every number, term list and pattern it
# uses is here, so tuning in Phase 4 is a config change. Term lists match whole words,
# case-insensitively, after Korean aliases are rewritten to the English vocabulary.
# Patterns are regular-expression sources compiled with the `iu` flags.
#
# Provenance: the relevance vocabulary, lifts and caps are the legacy
# scripts/lib/relevance-classifier.mjs rules re-expressed as data
# (docs/migration/notes/3c-scoring-selection.md §1); the other axes are new.

version: "2026-10-23.3"        # candidates.rubric_version = score/<version>; bump when a rule, weight or term changes

weights:                       # total = Σ weight × axis score (must sum to 1)
  relevance: 0.35
  timeliness: 0.2
  impact: 0.2
  reader_value: 0.15
  insight_potential: 0.1

thresholds:                    # total ≥ full → tier full; ≥ brief → tier brief; below → BELOW_THRESHOLD (ADR-004; 0.65/0.45 A/B in Phase 4)
  full: 0.75
  brief: 0.55
  relevance_min: 0.55          # hard floor on the relevance axis (legacy signal gate): an off-beat item cannot pass on impact/reader value alone (live run 39400530432: an EC speech at relevance 0.17 passed on total)

insight_trigger: 0.7           # insight_potential ≥ this marks the candidate eligible for an insight essay (3e)

selection:                     # the per-cycle count comes from config/pipeline.yaml caps.briefs_per_cycle
  per_source_max: 1            # at most one selected candidate per source and run (legacy source-repeat penalty)
  abstract_max_tier: brief     # text_scope: abstract sources (arXiv) never reach tier full (legacy signal_card cap)
  # No knob for a full-rights item without a positive extraction (payload.extraction.ok = true): the stage scores it on its
  # feed text as rewrite_only and caps it at brief in code (fail-closed, AGENTS.md; Codex PR #61).

