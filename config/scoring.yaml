# ---------------------------------------------------------------------------
# timeliness — age of the source item at the scheduled slot (ctx.now, ADR-002)
# ---------------------------------------------------------------------------
timeliness:                    # legacy rank.mjs buckets (32/24/18/12/8/2 of 32) normalised to 1
  buckets:
    - { max_hours: 3, score: 1.0 }
    - { max_hours: 8, score: 0.75 }
    - { max_hours: 18, score: 0.56 }
    - { max_hours: 30, score: 0.38 }
    - { max_hours: 48, score: 0.25 }
  beyond: 0.06                 # older than 48 h
  unknown_date: 0.25           # no source publication date

# ---------------------------------------------------------------------------
# impact — scale, actors and deal signals (each signal counts once; the first match is kept as the reason)
# ---------------------------------------------------------------------------
impact:
  title_boost: 0.25            # a signal matched in the title counts 1.25× its weight
  signals:
    - { id: capacity_gw, weight: 0.45, pattern: "\\b\\d+(?:[.,]\\d+)?\\s?gw\\b|\\b\\d+(?:[.,]\\d+)?\\s?gigawatts?\\b" }
    - { id: capacity_mw, weight: 0.35, pattern: "\\b\\d{2,}(?:[.,]\\d+)?\\s?mw\\b|\\b\\d{2,}(?:[.,]\\d+)?\\s?megawatts?\\b" }
    # Money needs a currency marker: a bare "1 million" is as often "1 million GPUs" (live run 39400530432) as a sum.
    - { id: money_billion, weight: 0.35, pattern: "(?:\\$|€|£|₩|usd\\s?|krw\\s?)\\s?\\d+(?:[.,]\\d+)?\\s?(?:billion|bn|b)\\b|\\b\\d+(?:[.,]\\d+)?\\s?(?:billion|bn)\\s?(?:dollars|euros|pounds|won|usd|eur|krw)\\b|\\d+(?:[.,]\\d+)?\\s?조\\s?원" }
    - { id: money_million, weight: 0.2, pattern: "(?:\\$|€|£|₩|usd\\s?|krw\\s?)\\s?\\d+(?:[.,]\\d+)?\\s?(?:million|mn|m)\\b|\\b\\d+(?:[.,]\\d+)?\\s?(?:million|mn)\\s?(?:dollars|euros|pounds|won|usd|eur|krw)\\b|\\d+(?:[.,]\\d+)?\\s?억\\s?원" }
    - { id: hyperscaler, weight: 0.25, terms: [microsoft, azure, google, alphabet, amazon, aws, meta, oracle, openai, anthropic, xai, alibaba, tencent, bytedance, coreweave, equinix, digital realty] }
    - { id: chip_major, weight: 0.2, terms: [nvidia, tsmc, sk hynix, samsung electronics, samsung, micron, amd, intel, broadcom, arm] }
    - { id: korea_major, weight: 0.2, terms: [kepco, 한전, korea electric power, naver, kakao, sk telecom, skt, kt, lg cns, lg uplus, samsung sds, sk broadband, 산업통상자원부, motie, 한국수력원자력, khnp] }
    - { id: deal_action, weight: 0.2, terms: [signs, signed, agreement, acquires, acquired, acquisition, invests, investment, breaks ground, broke ground, energized, energised, commissioned, approved, approves, awarded, secures, secured, announces, launches, 계약, 투자, 착공, 준공, 승인] }
    - { id: policy_grid, weight: 0.15, terms: [moratorium, tariff, tariffs, interconnection queue, large load, curtailment, regulator, ferc, kepco tariff, 요금제, 규제, 전력 수급] }

# ---------------------------------------------------------------------------
# reader_value — can the desk turn it into a brief a Korean infrastructure reader uses?
# ---------------------------------------------------------------------------
reader_value:
  text_rights: { full: 0.3, rewrite_only: 0.2, link_only: 0.05 }   # source rights (config/sources.yaml)
  body: { min_chars: 400, weight: 0.15 }                            # enough stored text to ground a brief
  tier: { "1": 0.2, "2": 0.12, "3": 0.05 }                          # source tier
  region: { weight: 0.2, terms: [korea, korean, south korea, 한국, 국내, seoul, 서울, busan, 부산, incheon, 인천, saemangeum, 새만금, gumi, 구미, pyeongtaek, 평택, yongin, 용인, kepco, apac, asia-pacific, asia pacific, japan, tokyo, osaka, singapore, malaysia, johor, taiwan, hong kong, australia, sydney, melbourne, india, mumbai, vietnam, indonesia, jakarta, thailand, philippines] }
  figures: { weight: 0.15, pattern: "\\b\\d+(?:[.,]\\d+)?\\s?(?:mw|gw|kv|kw|mwh|gwh|%|billion|million|bn)\\b|(?:\\$|€|£)\\s?\\d|\\d+(?:[.,]\\d+)?\\s?(?:조|억)\\s?원" }
  abstract_cap: 0.6            # text_scope: abstract sources

# ---------------------------------------------------------------------------
# insight_potential — does the story carry a thesis for a Josh-voice essay?
# ---------------------------------------------------------------------------
insight_potential:
  title_boost: 0.25
  themes:
    - { id: power_strategy, weight: 0.3, terms: [interconnection, grid constraint, grid constraints, grid connection, load growth, transmission, substation, ppa, energy procurement, nuclear, smr, behind-the-meter, behind the meter, curtailment, tariff, tariffs, power supply, 전력망, 계통, 변전소, 전력 수급] }
    - { id: capacity_planning, weight: 0.25, terms: [capacity, pipeline, pre-leased, preleased, absorption, vacancy, rack density, phase, ready-for-service, ready for service, rfs, expansion, 증설, 용량] }
    - { id: site_selection, weight: 0.25, terms: [site selection, siting, permitting, zoning, moratorium, land, campus, 부지, 인허가, 입지] }
    - { id: capital, weight: 0.25, terms: [financing, project finance, project financing, debt, equity, capex, joint venture, acquisition, valuation, bankability, lease, fund, 투자, 자금 조달] }
    - { id: korea_apac, weight: 0.2, terms: [korea, 한국, seoul, busan, incheon, saemangeum, apac, asia-pacific, japan, singapore, malaysia, johor, taiwan, australia, india, vietnam, indonesia] }
    - { id: contested, weight: 0.2, terms: [why, whether, risk, risks, shortage, shortages, bottleneck, bottlenecks, constraint, constraints, delay, delays, backlash, pushback, opposition, cost, costs, pricing, outlook, forecast, 전망, 리스크, 병목, 지연] }
  breadth: { min_dimensions: 2, min_score: 0.22, bonus: 0.15 }    # ≥ 2 relevance dimensions ≥ 0.22 → more angles
