name: Rebuild v2 CI

# Validates the rebuild workspaces (apps/site, packages/*) with zero network
# access during tests: fixtures only (brief R7). The legacy site keeps its own
# workflow (update-news.yml); this one runs only when rebuild paths change.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "config/*.yaml"
      - "fixtures/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/rebuild-ci.yml"
  workflow_dispatch:
    inputs:
      live_ingest:
        description: "Also run the ingest (3a), normalize (3b) and score (3c) stages against the live feeds (--dry-run --live; memory ledger, no secrets, nothing written)"
        type: boolean
        default: false
      log_level:
        description: "Pipeline log level for the live ingest job"
        type: choice
        default: info
        options: [debug, info, warn, error]

permissions:
  contents: read

concurrency:
  group: rebuild-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_DATA_SOURCE: empty
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck (tsc + astro check)
        run: npm run v2:typecheck
      - name: Test (node --test, fixtures only)
        run: npm run v2:test
      - name: Build site with zero published items
        run: npm run v2:build
      - name: Pipeline dry-run with the sample fixture (replay, no network)
        run: |
          npm run --silent v2:pipeline -- run --dry-run --replay --fixture sample --json > pipeline-dry-run.json
          node -e "const r=require('./pipeline-dry-run.json'); console.log(JSON.stringify({status:r.status, funnel:r.funnel, stages:r.stages.map(s=>s.stage+':'+s.status)}, null, 2)); if (r.status !== 'done') process.exit(1)"
      - name: Normalize dry-run with the dedupe fixture (3 wires, 12 items -> 6 candidates; replay, no network)
        env:
          CC_FLAG_STAGES_NORMALIZE: "true"
        run: |
          npm run --silent v2:pipeline -- run --dry-run --replay --fixture dedupe --sources fixtures/sources/dedupe.yaml --stage ingest,normalize --json > normalize-dry-run.json
          node -e "const r=require('./normalize-dry-run.json'); const n=r.normalizeStats; console.log(JSON.stringify({status:r.status, pool:n.pool, candidates:n.candidates, rejected:n.rejected, by_method:n.by_method}, null, 2)); if (r.status !== 'done' || n.pool !== 12 || n.candidates !== 6) process.exit(1)"
      - name: Score dry-run with the scoring fixture (5 sources, 13 items -> 2 selected from 2 sources; replay, no network)
        env:
          CC_FLAG_STAGES_NORMALIZE: "true"
          CC_FLAG_STAGES_SCORE: "true"
        run: |
          npm run --silent v2:pipeline -- run --dry-run --replay --fixture scoring --sources fixtures/sources/scoring.yaml --stage ingest,normalize,score --json > score-dry-run.json
          node -e "const r=require('./score-dry-run.json'); const s=r.scoreStats; console.log(JSON.stringify({status:r.status, candidates:s.candidates, passed:s.passed, full:s.full, brief:s.brief, below_threshold:s.below_threshold, selected:s.selected, shortfall:s.shortfall, selected_items:s.decisions.filter(d=>d.selected).map(d=>[d.source_id, d.total, d.tier])}, null, 2)); const sources=new Set(s.decisions.filter(d=>d.selected).map(d=>d.source_id)); if (r.status !== 'done' || s.candidates !== 13 || s.selected !== 2 || sources.size !== 2 || s.passed < 5) process.exit(1)"
          node packages/pipeline/tools/ingest-dry-run-summary.ts score-dry-run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Generate dry-run with the scoring fixture (2 selected -> 2 news_brief drafts from recorded replies; replay, no network, fixture LLM)
        env:
          CC_FLAG_STAGES_NORMALIZE: "true"
          CC_FLAG_STAGES_SCORE: "true"
          CC_FLAG_STAGES_GENERATE: "true"
          CC_FLAG_STAGES_IMAGE: "true"
        run: |
          npm run --silent v2:pipeline -- run --dry-run --replay --fixture scoring --sources fixtures/sources/scoring.yaml --stage ingest,normalize,score,generate,qa,image --json > generate-dry-run.json
          node -e "const r=require('./generate-dry-run.json'); const g=r.generateStats; console.log(JSON.stringify({status:r.status, selected:g.selected, drafted:g.drafted, failed:g.failed, grounding:g.grounding, pass_rate:g.grounding_pass_rate, quote_max_words:g.quote_max_words, cost_usd:g.cost_usd, drafts:g.decisions.map(d=>[d.source_id, d.ok, d.slug, d.grounding_ungrounded])}, null, 2)); if (r.status !== 'done' || g.selected !== 2 || g.drafted !== 2 || g.failed !== 0 || g.grounding.checked !== 2 || g.grounding.passed !== 1) process.exit(1); const img=r.stages.find(s=>s.stage==='image'); const i=r.imageStats; console.log(JSON.stringify({image: img, imageStats: {passed: i.passed, with_images: i.with_images, placeholders: i.placeholders, image_missing: i.image_missing}})); if (!img || img.status !== 'done' || i.passed !== 0 || i.with_images !== 0) process.exit(1)"
          node packages/pipeline/tools/ingest-dry-run-summary.ts generate-dry-run.json >> "$GITHUB_STEP_SUMMARY"

  # Manual only (brief Phase 3 common procedure 4): the cloud session cannot reach
  # the feed hosts, so this job is the evidence path for "items_fetched per cycle
  # vs Phase 0" (3a), for the dedupe counts on a real pool (3b) and for the rubric
  # verdicts on real candidates (3c). Dispatch with live_ingest=true on the branch
  # under review. The full JSON result goes to the job log; the step summary
  # carries the funnel, a per-source table, the normalize decisions and the score
  # verdicts with their reasons. No secrets, memory ledger and DB only.
  ingest-live-dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_ingest }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC_FLAG_PUBLISH_TARGET: none
      CC_FLAG_STAGES_NORMALIZE: "true"   # 3b: default OFF in config/pipeline.yaml; the evidence run turns it on
      CC_FLAG_STAGES_SCORE: "true"       # 3c: same
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ingest + normalize + score dry-run against live feeds (memory ledger and DB)
        id: run
        env:
          LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          set +e
          node packages/pipeline/bin/pipeline.ts run --dry-run --live --stage ingest,normalize,score --trigger dispatch --json \
            --log-level "$LOG_LEVEL" > ingest-dry-run.json 2> ingest-dry-run.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code: $code (0 done, 1 partial, 2 failed/config)"
          tail -n 300 ingest-dry-run.log
      - name: Step summary
        if: always()
        run: |
          if [ -s ingest-dry-run.json ]; then
            node packages/pipeline/tools/ingest-dry-run-summary.ts ingest-dry-run.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Ingest dry-run produced no JSON (exit code ${{ steps.run.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 ingest-dry-run.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Full JSON result (job log)
        if: always()
        run: cat ingest-dry-run.json || true
      - name: Fail only on usage or config errors
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" = "2" ]; then
            echo "pipeline exited 2 (usage/config/failed run)"; exit 2
          fi
