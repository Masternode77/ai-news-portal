name: Legacy migration (Phase 5 M5)

# docs/migration/phase5-cutover.md step 7: write the 12 public legacy pages into `publications` and
# config/redirects.yaml into `redirects` (packages/pipeline/tools/migrate-legacy-publications.ts --apply;
# idempotent upserts, read back afterwards). Dispatch only, no pull_request trigger (secrets never reach a fork).
# mode=dry-run prints the plan and touches nothing. Writing production is a STOP-THE-LINE approval item
# (ADR-006 M5): it runs only with target=production, mode=apply and the confirm text below, which sets the
# cutover flag CC_ALLOW_PRODUCTION_PUBLISH for this one step. Secrets are used by name only.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Project to write: staging (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY) or production (SUPABASE_PROD_URL / SUPABASE_PROD_SERVICE_ROLE_KEY)"
        type: choice
        default: staging
        options: [staging, production]
      mode:
        description: "dry-run prints the plan; apply writes it"
        type: choice
        default: dry-run
        options: [dry-run, apply]
      confirm:
        description: "For target=production with mode=apply, type: M5 approved"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cc-legacy-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan (dry-run)
        run: node packages/pipeline/tools/migrate-legacy-publications.ts --dry-run | tee plan.json
      - name: Apply
        if: ${{ inputs.mode == 'apply' }}
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_URL: ${{ inputs.target == 'staging' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.target == 'staging' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_PROD_URL: ${{ inputs.target == 'production' && secrets.SUPABASE_PROD_URL || '' }}
          SUPABASE_PROD_SERVICE_ROLE_KEY: ${{ inputs.target == 'production' && secrets.SUPABASE_PROD_SERVICE_ROLE_KEY || '' }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ "$CONFIRM" != "M5 approved" ]; then
              echo "target=production needs confirm='M5 approved' (STOP-THE-LINE approval item)"; exit 2
            fi
            export CC_ALLOW_PRODUCTION_PUBLISH=true
          fi
          node packages/pipeline/tools/migrate-legacy-publications.ts --apply --target "$TARGET" | tee apply.json
          {
            echo "### Legacy migration — target $TARGET"
            echo '```json'
            cat apply.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
