name: Prod Smoke

# Manual production probe. The site is only observable from environments with
# open egress, so this runs a few read-only checks against the live domain
# from a GitHub-hosted runner and prints the results into the job log.
on:
  workflow_dispatch:
    inputs:
      path:
        description: Extra path to probe (e.g. /column/<slug>/)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Probe production
        env:
          EXTRA_PATH: ${{ inputs.path }}
        run: node ./scripts/probe-production-surface.mjs
