name: Release

on:
  workflow_run:
    workflows:
      - Application Validation
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: ai-news-portal-main-writes
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !endsWith(github.event.workflow_run.actor.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout validated main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Determine release eligibility
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --format=%B | grep -Fq '[skip release]'; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          application_change=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              src/data/*|public/generated/*|config/codex-image-manifest.json|scripts/state/pipeline-state.json|docs/admin-exclusion-report.md|docs/omo-ultra-audit.md|docs/rendered-public-output-report.md|docs/taxonomy-pages-report.md)
                ;;
              *)
                application_change=true
                break
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "eligible=${application_change}" >> "$GITHUB_OUTPUT"

      - name: Confirm the validated commit is still main
        if: steps.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_run'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]; then
            echo 'Validated commit is no longer the main head.' >&2
            exit 1
          fi

      - name: Install manual validation dependencies
        if: steps.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xsltproc
          npm ci

      - name: Validate manual release source
        if: steps.eligibility.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch'
        env:
          LLM_PROVIDER: disabled
          PIPELINE_OFFLINE: '1'
        run: |
          npm audit --omit=dev --audit-level=high
          npm run check
          PIPELINE_OFFLINE=0 npm test
          npm run content:gate:built

      - name: Bump version
        if: steps.eligibility.outputs.eligible == 'true'
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          case "$REQUESTED_BUMP" in
            patch|minor|major) ;;
            *) echo "Unsupported version bump: $REQUESTED_BUMP" >&2; exit 1 ;;
          esac

          npm version "$REQUESTED_BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag already exists: ${TAG}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Commit version and tag
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release ${TAG} [skip release]"
          git tag -a "$TAG" -m "Compute Current ${TAG}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Publish GitHub release
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "Compute Current ${TAG}"
