name: Refresh infrastructure data
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-news-portal-main-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Refresh independent datasets
        id: refresh
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/refresh-infrastructure-data.mjs
      - name: Validate retained and refreshed data
        run: |
          node --test tests/infrastructure-data.test.mjs tests/eia860m-discovery.test.mjs
          python3 -m unittest discover -s tests -p test_eia860_parser.py
      - name: Commit validated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/grid/demand.json src/data/grid/capacity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public infrastructure data'
          git push origin HEAD:main
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
