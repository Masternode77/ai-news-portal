name: Validate News

# Generation runs in the existing Mac Codex task using subscription CLIs.
# Hosted runners validate artifacts and never receive subscription credentials.
on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'public/generated/**'
      - 'config/codex-image-manifest.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-portal-news-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLM_PROVIDER: disabled
      PIPELINE_OFFLINE: '1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install XSLT processor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xsltproc
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm run check
      - name: Synchronize current-state audit
        run: node ./scripts/audit-omo-ultra-current-state.mjs
      - name: Run full test suite
        # Network-facing tests install mocked fetch fixtures. Keep their source
        # adapters enabled; LLM_PROVIDER remains disabled, so no model can run.
        env:
          PIPELINE_OFFLINE: '0'
        run: npm test
      - name: Run production content gate
        run: npm run content:gate
      - name: Verify final current-state audit
        run: |
          node ./scripts/audit-omo-ultra-current-state.mjs
          node --test tests/omo-ultra-audit.test.mjs
