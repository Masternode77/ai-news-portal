name: Update News

on:
  schedule:
    # Full news pipeline: 00:05 / 08:05 / 16:05 KST
    - cron: '5 15 * * *'
    - cron: '5 23 * * *'
    - cron: '5 7 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: ai-news-portal-main-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install XSLT processor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xsltproc

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Run news update
        timeout-minutes: 18
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          EXPERT_LENS_MODEL: ${{ secrets.EXPERT_LENS_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ARCHIVE_TABLE: ${{ secrets.SUPABASE_ARCHIVE_TABLE }}
        run: npm run pipeline

      - name: Restore approved public inventory
        run: node ./scripts/restore-eia-public-inventory.mjs

      - name: Rebuild public taxonomy pages
        run: npm run rebuild:taxonomy-pages

      - name: Synchronize current-state audit
        run: node ./scripts/audit-omo-ultra-current-state.mjs

      - name: Run full test suite
        run: npm test

      - name: Run production content gate
        run: npm run content:gate

      - name: Synchronize final current-state audit
        run: |
          node ./scripts/audit-omo-ultra-current-state.mjs
          node --test tests/omo-ultra-audit.test.mjs

      - name: Record successful scheduled update
        run: node ./scripts/record-pipeline-heartbeat.mjs ok

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/data/latest-news.json \
            src/data/archived-news.json \
            src/data/search-index.json \
            src/data/news-pool.json \
            src/data/taxonomy-pages.json \
            src/data/pipeline-heartbeat.json \
            scripts/state/pipeline-state.json \
            docs/omo-ultra-audit.md \
            public/generated

          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh news surface and archive [skip ci]"
          git push origin HEAD:main
