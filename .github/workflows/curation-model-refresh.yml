name: Curation Model Refresh

# Once a month, look up the newest general-purpose OpenAI GPT text model on
# OpenRouter, verify it answers a JSON ping, and commit it as the curation
# model. CURATION_MODEL (secret) still pins a model over this file.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curation-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'

      - name: Pick and verify the newest model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node ./scripts/refresh-curation-model.mjs

      - name: Commit the switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/curation-model.json
          if git diff --cached --quiet; then
            echo "Curation model unchanged."
            exit 0
          fi
          model=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("config/curation-model.json","utf8")).model)')
          git commit -m "chore: switch curation model to ${model} [skip release]"
          git push origin HEAD:main
