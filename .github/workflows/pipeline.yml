name: Pipeline v2 (rebuild)

# Phase 3i (ADR-002): the scheduled runtime of the rebuilt pipeline. Two ways in.
# `workflow_dispatch` takes inputs: `dry_run` (default true) keeps the ledger and
# DB in memory; `dry_run=false` + `live=true` writes the staging Supabase project
# named by the SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets (ADR-006 M4).
# `schedule` is the Phase 4 shadow itself (enabled 2026-10-29 under Josh's explicit
# schedule approval of 2026-10-26, CLAUDE.md §3): a scheduled run carries no inputs,
# so the `github.event_name == 'schedule'` expressions below pin it to live feeds,
# staging writes, every stage on, the real model (CC_FLAG_LLM_PROVIDER=anthropic),
# the Telegram summary, the ops check and the alarm issue. The production publish
# target is refused by the CLI until the Phase 5 cutover. No pull_request trigger:
# secrets must never reach a fork.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Memory ledger and DB, nothing written (--dry-run). false = Phase 4 shadow: writes the staging Supabase project (requires live=true and the SUPABASE_* secrets)"
        type: boolean
        default: true
      live:
        description: "Read the live feeds (--live) instead of replaying a fixture (--replay); required when dry_run is false"
        type: boolean
        default: false
      fixture:
        description: "Fixture to replay when live is false"
        type: choice
        default: scoring
        options: [sample, dedupe, scoring]
      sources:
        description: "Sources file (fixtures/sources/scoring.yaml for the scoring fixture; config/sources.yaml for live)"
        type: string
        default: fixtures/sources/scoring.yaml
      stages_on:
        description: "Turn every stage flag on (normalize, score, generate, qa, image); off keeps config/pipeline.yaml defaults"
        type: boolean
        default: true
      publish_target:
        description: "flags.publish_target: none reports would-publish rows, staging writes them to the run's memory DB under --dry-run"
        type: choice
        default: none
        options: [none, staging]
      llm_provider:
        description: "llm.provider for this run (CC_FLAG_LLM_PROVIDER): fixture replays recorded drafts; anthropic calls the Messages API (needs ANTHROPIC_API_KEY, spends money up to budget.run_usd)"
        type: choice
        default: fixture
        options: [fixture, anthropic, disabled]
      notify:
        description: "Send the run summary to Telegram (notify.telegram via CC_FLAG_NOTIFY_TELEGRAM; needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets)"
        type: boolean
        default: false
      ops_check:
        description: "Also run `pipeline ops` against the Supabase ledger (needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets; skipped without them)"
        type: boolean
        default: false
      log_level:
        description: "Pipeline log level"
        type: choice
        default: info
        options: [debug, info, warn, error]
  # Phase 4 shadow (ADR-002; schedule approval Josh 2026-10-26, enabled 2026-10-29). Mirrors config/pipeline.yaml schedule.cron.
  schedule:
    - cron: "45 15,23,7 * * *"   # 00:45 / 08:45 / 16:45 KST

permissions:
  contents: read

# ADR-002: never two generating runs at once; a late cron waits instead of cancelling the one in flight.
concurrency:
  group: cc-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets by name only (absent → empty → the CLI treats them as unset). A scheduled run needs all of
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / ANTHROPIC_API_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID;
      # a dispatch with the defaults (dry run, fixture model, no Telegram) needs none.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # A scheduled run has no inputs: it is always the shadow run (staging, every stage, Telegram, anthropic).
      CC_FLAG_PUBLISH_TARGET: ${{ github.event_name == 'schedule' && 'staging' || inputs.publish_target }}
      CC_FLAG_NOTIFY_TELEGRAM: ${{ (github.event_name == 'schedule' || inputs.notify) && 'true' || 'false' }}
      CC_FLAG_LLM_PROVIDER: ${{ github.event_name == 'schedule' && 'anthropic' || inputs.llm_provider }}
      CC_FLAG_STAGES_NORMALIZE: ${{ (github.event_name == 'schedule' || inputs.stages_on) && 'true' || 'false' }}
      CC_FLAG_STAGES_SCORE: ${{ (github.event_name == 'schedule' || inputs.stages_on) && 'true' || 'false' }}
      CC_FLAG_STAGES_GENERATE: ${{ (github.event_name == 'schedule' || inputs.stages_on) && 'true' || 'false' }}
      CC_FLAG_STAGES_QA: ${{ (github.event_name == 'schedule' || inputs.stages_on) && 'true' || 'false' }}
      CC_FLAG_STAGES_IMAGE: ${{ (github.event_name == 'schedule' || inputs.stages_on) && 'true' || 'false' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pipeline run (the ledger row, the summary and the Telegram message are the evidence)
        id: run
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          LIVE: ${{ github.event_name == 'schedule' && 'true' || inputs.live }}
          FIXTURE: ${{ inputs.fixture || 'scoring' }}
          SOURCES: ${{ inputs.sources || 'fixtures/sources/scoring.yaml' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'dispatch' }}
        run: |
          set +e
          if [ "$LIVE" = "true" ]; then
            mode="--live --sources config/sources.yaml"
          else
            mode="--replay --fixture $FIXTURE --sources $SOURCES"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            dry="--dry-run"
          else
            # Phase 4 shadow (ADR-006 M4): the CLI refuses this without --live and without the SUPABASE_* names.
            dry=""
          fi
          node packages/pipeline/bin/pipeline.ts run $dry $mode --trigger "$TRIGGER" --json --log-level "$LOG_LEVEL" \
            > pipeline-run.json 2> pipeline-run.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "pipeline exit code: $code (0 done, 1 partial/budget_stop, 2 failed/config)"
          tail -n 200 pipeline-run.log
      - name: Step summary
        if: always()
        run: |
          if [ -s pipeline-run.json ]; then
            node packages/pipeline/tools/ingest-dry-run-summary.ts pipeline-run.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Pipeline run produced no JSON (exit code ${{ steps.run.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 pipeline-run.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: "Upload run artifact (ADR-007: run log JSON, 90 days)"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: |
            pipeline-run.json
            pipeline-run.log
          retention-days: 90
          if-no-files-found: warn
      - name: Fail only on usage, config or crashed runs
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" = "2" ]; then
            echo "pipeline exited 2 (usage/config/failed run)"; exit 2
          fi

  # ADR-007: the heartbeat is the ledger. Reads pipeline_runs and exits 1 when the latest completed
  # run is older than slot_hours × 1.5, no run ever completed, or the last two finished runs failed.
  # Phase 4 (3i notes §5.3, Josh 2026-10-26): the GitHub-issue alarm sits on top of that exit code —
  # one issue found by its body marker, written only on a state transition, closed on recovery,
  # reopened on relapse; exit 2 (no verdict) is the alert state `unknown`, never healthy.
  ops-check:
    if: ${{ github.event_name == 'schedule' || inputs.ops_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write   # the alarm issue only; the run job above keeps contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ops check against the run ledger
        id: ops
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "## Ops check skipped: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured (names only)" >> "$GITHUB_STEP_SUMMARY"
            echo "exit_code=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node packages/pipeline/bin/pipeline.ts ops --json > ops.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "ops exit code: $code (0 ok, 1 alert, 2 usage/config/fetch error)"
          { echo "## Ops check (exit $code)"; echo '```'; node -e "try { process.stdout.write(require('./ops.json').text + '\\n') } catch { process.stdout.write('no ops verdict (see the job log)\\n') }"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Ops alarm issue (marker, write on transition only, close on recovery)"
        if: ${{ always() && steps.ops.outputs.exit_code != 'skipped' && steps.ops.outputs.exit_code != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_EXIT_CODE: ${{ steps.ops.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node packages/pipeline/tools/ops-issue-sync.ts --report ops.json --exit-code "$OPS_EXIT_CODE" --run-url "$RUN_URL" --json | tee ops-issue.json
          { echo "### Ops alarm issue"; echo '```'; cat ops-issue.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the job on an ops alert (the alarm issue is the durable signal; this keeps the run red too)
        if: ${{ always() && steps.ops.outputs.exit_code != 'skipped' && steps.ops.outputs.exit_code != '' && steps.ops.outputs.exit_code != '0' }}
        run: |
          echo "ops exit code ${{ steps.ops.outputs.exit_code }}"; exit 1
