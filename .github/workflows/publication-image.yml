name: Publication image (3e)
run-name: "Publication image — ${{ inputs.target }} · ${{ inputs.mode }}${{ inputs.slug != '' && format(' · {0}', inputs.slug) || '' }}"

# Attach a hero image to one published row (packages/pipeline/tools/set-publication-image.ts). Two sources:
# - path: a file committed under apps/site/public/generated/articles/<dir>/ and deployed before this runs; the tool
#   checks the file is in the checkout.
# - source_url (Josh 2026-11-19 A안): an https URL on a config/pipeline.yaml image.import.allowed_hosts host
#   (Higgsfield's CDN). The tool downloads it, uploads it to the project's image bucket like a served run and
#   points the row at /media/<key>; nothing is committed.
# The tool then sets `publications.image` and reads it back. mode=dry-run reads the row and prints the
# before/after without uploading or writing; mode=list-missing prints the newest pipeline essays whose image is
# missing or the placeholder (read-only; the scheduled image task reads it from the log). Dispatch only, no
# pull_request trigger (secrets never reach a fork). Writing production is a STOP-THE-LINE approval item:
# target=production with mode=apply needs the confirm text below, which sets CC_ALLOW_PRODUCTION_PUBLISH for this
# one step. Secrets are used by name only.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Project: staging (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY) or production (SUPABASE_PROD_URL / SUPABASE_PROD_SERVICE_ROLE_KEY)"
        type: choice
        default: staging
        options: [staging, production]
      mode:
        description: "dry-run reads the row and prints the change; apply writes it; list-missing prints essays without an image (other inputs ignored)"
        type: choice
        default: dry-run
        options: [dry-run, apply, list-missing]
      slug:
        description: "publications.slug, e.g. column/<title>-YYYY-MM-DD (dry-run/apply)"
        type: string
        default: ""
      path:
        description: "Site-relative image path, e.g. /generated/articles/<dir>/hero.webp (must exist in the checkout). Give path or source_url"
        type: string
        default: ""
      source_url:
        description: "https URL on an image.import.allowed_hosts host (Higgsfield CDN); uploaded to the image bucket. Give path or source_url"
        type: string
        default: ""
      alt:
        description: "Alt text (dry-run/apply)"
        type: string
        default: ""
      provider:
        description: "Image provenance provider (higgsfield, openai, …)"
        type: string
        default: higgsfield
      model:
        description: "Image provenance model"
        type: string
        default: ""
      prompt:
        description: "Image provenance prompt"
        type: string
        default: ""
      confirm:
        description: "For target=production with mode=apply, type: image approved"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cc-publication-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set the image
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          SLUG: ${{ inputs.slug }}
          IMAGE_PATH: ${{ inputs.path }}
          SOURCE_URL: ${{ inputs.source_url }}
          ALT: ${{ inputs.alt }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
          SUPABASE_URL: ${{ inputs.target == 'staging' && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.target == 'staging' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_PROD_URL: ${{ inputs.target == 'production' && secrets.SUPABASE_PROD_URL || '' }}
          SUPABASE_PROD_SERVICE_ROLE_KEY: ${{ inputs.target == 'production' && secrets.SUPABASE_PROD_SERVICE_ROLE_KEY || '' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "apply" ] && [ "$TARGET" = "production" ]; then
            if [ "$CONFIRM" != "image approved" ]; then
              echo "target=production with mode=apply needs confirm='image approved' (STOP-THE-LINE approval item)"; exit 2
            fi
            export CC_ALLOW_PRODUCTION_PUBLISH=true
          fi
          if [ "$MODE" = "list-missing" ]; then
            args=(--list-missing --target "$TARGET")
          else
            # The tool refuses both or neither of path and source_url.
            args=(--"$MODE" --target "$TARGET" --slug "$SLUG" --alt "$ALT" --provider "$PROVIDER" --prompt "$PROMPT")
            if [ -n "$IMAGE_PATH" ]; then args+=(--path "$IMAGE_PATH"); fi
            if [ -n "$SOURCE_URL" ]; then args+=(--source-url "$SOURCE_URL"); fi
            if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          fi
          node packages/pipeline/tools/set-publication-image.ts "${args[@]}" | tee result.json
          {
            echo "### Publication image — $TARGET · $MODE"
            echo '```json'
            cat result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
